<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>霍格沃茨分院测试 · 大五人格魔法版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&family=Noto+Serif+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark:#0d0a1a; --bg-card:#13102a; --bg-parchment:#1a1430;
  --gold:#c9a84c; --gold-light:#e8c97a; --gold-dim:#7a6130;
  --silver:#a8b5c8; --text-main:#e8dfc8; --text-dim:#8a7e6a; --text-bright:#f5ead8;
  --border:rgba(201,168,76,0.3); --border-bright:rgba(201,168,76,0.7);
  --glow:rgba(201,168,76,0.15);
  --gryffindor:#ae0001; --gryffindor2:#eeba30;
  --slytherin:#1a472a;  --slytherin2:#aaaaaa;
  --ravenclaw:#0e1a40;  --ravenclaw2:#946b2d;
  --hufflepuff:#ecb939; --hufflepuff2:#372e29;
  --radius:12px; --trans:all 0.35s cubic-bezier(0.4,0,0.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{font-family:'Noto Serif SC','IM Fell English',serif;background:var(--bg-dark);color:var(--text-main);min-height:100vh;overflow-x:hidden;line-height:1.7;}
.stars-layer{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(1px 1px at 10% 15%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 25% 40%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 50% 8%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 70% 30%,rgba(255,255,255,.6) 0%,transparent 100%),
    radial-gradient(1px 1px at 85% 60%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 92% 10%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 5% 70%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1px 1px at 38% 85%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 60% 55%,rgba(255,255,255,.5) 0%,transparent 100%),
    radial-gradient(1px 1px at 15% 90%,rgba(255,255,255,.4) 0%,transparent 100%),
    radial-gradient(1.5px 1.5px at 78% 78%,rgba(255,255,255,.3) 0%,transparent 100%),
    radial-gradient(1px 1px at 43% 62%,rgba(255,255,255,.5) 0%,transparent 100%);
  animation:twinkle 8s ease-in-out infinite alternate;}
@keyframes twinkle{0%{opacity:.6}100%{opacity:1}}
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 16px 80px;min-height:100vh;}
.gold-divider{width:100%;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:20px 0;}
.page{display:none;animation:fadeIn .5s ease;}
.page.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
#page-home{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90vh;text-align:center;padding-top:40px;}
.crest-wrap{position:relative;margin-bottom:24px;width:160px;height:160px;}
.crest-wrap::before{content:'';position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,.12) 0%,transparent 70%);animation:pulseGlow 3s ease-in-out infinite;}
@keyframes pulseGlow{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.1);opacity:1}}
.crest-svg{width:160px;height:160px;filter:drop-shadow(0 0 20px rgba(201,168,76,.6));}
.home-title{font-family:'Cinzel Decorative',serif;font-size:clamp(1.6rem,5vw,2.6rem);color:var(--gold-light);letter-spacing:.05em;line-height:1.3;text-shadow:0 0 30px rgba(201,168,76,.5);}
.home-subtitle{font-family:'Cinzel',serif;font-size:clamp(.85rem,2.5vw,1.05rem);color:var(--silver);letter-spacing:.2em;margin-top:8px;text-transform:uppercase;}
.home-desc{max-width:520px;font-size:.95rem;color:var(--text-dim);font-style:italic;line-height:1.9;margin-top:20px;}
.btn-start{margin-top:36px;font-family:'Cinzel',serif;font-size:1.05rem;letter-spacing:.15em;color:var(--bg-dark);background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 50%,var(--gold) 100%);border:none;outline:none;padding:14px 48px;border-radius:4px;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 4px 24px rgba(201,168,76,.4),inset 0 1px 0 rgba(255,255,255,.3);transition:var(--trans);}
.btn-start::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);transform:translateX(-100%);transition:transform .5s;}
.btn-start:hover::before{transform:translateX(100%);}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(201,168,76,.6),inset 0 1px 0 rgba(255,255,255,.3);}
.btn-start:active{transform:translateY(0);}
.disclaimer{margin-top:24px;font-size:.72rem;color:var(--text-dim);opacity:.7;max-width:480px;line-height:1.6;}

/* QUIZ */
#page-quiz{padding-top:10px;}
.progress-wrap{margin-bottom:28px;}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.progress-scene{font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.15em;color:var(--gold);text-transform:uppercase;}
.progress-count{font-size:.78rem;color:var(--text-dim);}
.progress-bar-track{height:4px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-light));border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px var(--gold);}
.question-card{background:linear-gradient(160deg,#1a1535 0%,#120f28 100%);border:1px solid var(--border);border-radius:var(--radius);padding:28px 24px 24px;position:relative;box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(201,168,76,.1);}
.question-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border-radius:var(--radius) var(--radius) 0 0;}
.scene-label{font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.2em;color:var(--gold-dim);text-transform:uppercase;margin-bottom:14px;}
.question-num{font-family:'Cinzel',serif;font-size:.8rem;color:var(--text-dim);margin-bottom:6px;}
.question-text{font-size:clamp(1rem,3vw,1.12rem);color:var(--text-bright);line-height:1.75;margin-bottom:24px;font-style:italic;}
.options-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
.option-btn{width:100%;text-align:left;background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.2);border-radius:8px;padding:13px 16px 13px 44px;color:var(--text-main);font-family:'Noto Serif SC',serif;font-size:.92rem;line-height:1.55;cursor:pointer;position:relative;transition:var(--trans);}
.option-btn .opt-letter{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:'Cinzel',serif;font-size:.72rem;font-weight:700;color:var(--gold-dim);width:20px;text-align:center;}
.option-btn:hover{background:rgba(201,168,76,.08);border-color:var(--gold);color:var(--text-bright);transform:translateX(4px);}
.option-btn:hover .opt-letter{color:var(--gold-light);}
.option-btn.selected{background:rgba(201,168,76,.12);border-color:var(--gold);color:var(--text-bright);box-shadow:0 0 0 1px rgba(201,168,76,.3);}
.option-btn.selected .opt-letter{color:var(--gold-light);}
.quiz-nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px;}
.btn-nav{font-family:'Cinzel',serif;font-size:.82rem;letter-spacing:.1em;padding:10px 24px;border-radius:4px;cursor:pointer;transition:var(--trans);border:1px solid var(--border);background:transparent;color:var(--text-dim);}
.btn-nav:hover{border-color:var(--gold);color:var(--gold);}
.btn-nav.primary{background:linear-gradient(135deg,var(--gold) 0%,var(--gold-light) 100%);color:var(--bg-dark);border:none;font-weight:700;box-shadow:0 4px 16px rgba(201,168,76,.3);}
.btn-nav.primary:hover{box-shadow:0 6px 24px rgba(201,168,76,.5);transform:translateY(-1px);}
.btn-nav:disabled{opacity:.3;cursor:not-allowed;transform:none!important;}

/* LOADING */
#page-loading{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;}
#page-loading.active{display:flex;}
.sorting-hat-wrap{font-size:5rem;animation:float 2s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(201,168,76,.5));}
@keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-12px) rotate(5deg)}}
.loading-text{font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.2em;color:var(--gold);margin-top:28px;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.loading-dots span{display:inline-block;animation:dotBounce 1.4s ease-in-out infinite;}
.loading-dots span:nth-child(2){animation-delay:.2s;}
.loading-dots span:nth-child(3){animation-delay:.4s;}
@keyframes dotBounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

/* RESULT */
#page-result{padding-top:10px;}
.result-banner{border-radius:var(--radius);padding:36px 24px 28px;text-align:center;position:relative;overflow:hidden;margin-bottom:24px;border:1px solid rgba(255,255,255,.1);}
.result-banner::before{content:'';position:absolute;inset:0;opacity:.07;background:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0px,rgba(255,255,255,.3) 1px,transparent 1px,transparent 20px);}
.house-badge{font-size:5rem;display:block;margin-bottom:12px;filter:drop-shadow(0 0 20px currentColor);animation:badgePop .6s cubic-bezier(.175,.885,.32,1.275) both;animation-delay:.3s;opacity:0;}
@keyframes badgePop{from{transform:scale(.3) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.result-house-name{font-family:'Cinzel Decorative',serif;font-size:clamp(1.6rem,5vw,2.4rem);font-weight:700;text-shadow:0 0 30px currentColor;animation:slideUp .5s ease both;animation-delay:.6s;opacity:0;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.result-house-motto{font-style:italic;font-size:.88rem;opacity:.7;margin-top:6px;animation:slideUp .5s ease both;animation-delay:.8s;opacity:0;}
.result-personality-tag{display:inline-block;font-family:'Cinzel',serif;font-size:.78rem;letter-spacing:.2em;padding:5px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);margin-top:14px;animation:slideUp .5s ease both;animation-delay:1s;opacity:0;}
.result-desc-card{background:linear-gradient(160deg,#1a1535,#120f28);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;font-size:.95rem;line-height:1.9;color:var(--text-main);animation:slideUp .5s ease both;animation-delay:1.1s;opacity:0;}
.result-desc-card h3{font-family:'Cinzel',serif;color:var(--gold);font-size:.9rem;letter-spacing:.15em;margin-bottom:12px;text-transform:uppercase;}
.ocean-section{background:linear-gradient(160deg,#1a1535,#120f28);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px;animation:slideUp .5s ease both;animation-delay:1.3s;opacity:0;}
.ocean-section h3{font-family:'Cinzel',serif;color:var(--gold);font-size:.9rem;letter-spacing:.15em;margin-bottom:20px;text-transform:uppercase;}
.ocean-bar-item{margin-bottom:16px;}
.ocean-bar-label{display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:6px;}
.ocean-bar-name{color:var(--text-main);font-weight:500;}
.ocean-bar-val{color:var(--gold);font-family:'Cinzel',serif;}
.ocean-bar-track{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
.ocean-bar-fill{height:100%;width:0;border-radius:3px;transition:width 1.2s cubic-bezier(.4,0,.2,1);background:linear-gradient(90deg,var(--gold-dim),var(--gold-light));box-shadow:0 0 6px rgba(201,168,76,.4);}
.btn-restart{width:100%;padding:14px;font-family:'Cinzel',serif;font-size:.92rem;letter-spacing:.15em;color:var(--gold);background:transparent;border:1px solid var(--border-bright);border-radius:4px;cursor:pointer;transition:var(--trans);margin-top:8px;animation:slideUp .5s ease both;animation-delay:1.6s;opacity:0;}
.btn-restart:hover{background:rgba(201,168,76,.08);box-shadow:0 0 20px rgba(201,168,76,.2);}
@media(max-width:480px){
  #app{padding:12px 12px 80px;}
  .question-card{padding:20px 16px 18px;}
  .result-banner{padding:28px 16px 22px;}
  .btn-nav{padding:10px 16px;font-size:.78rem;}
}
</style>
</head>
<body>
<div class="stars-layer"></div>

<!-- 🎵 BGM：替换 src 中的链接即可 -->
<div id="bgm-container" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;">
  <audio id="bgm" loop preload="auto">
    <source src="https://music.163.com/song/media/outer/url?id=5197491.mp3" type="audio/mpeg">
  </audio>
  <button id="bgmBtn" onclick="toggleBGM()"
    style="font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.1em;
    background:rgba(13,10,26,.9);color:#c9a84c;border:1px solid rgba(201,168,76,.5);
    border-radius:20px;padding:7px 18px;cursor:pointer;backdrop-filter:blur(8px);
    box-shadow:0 0 16px rgba(201,168,76,.25);white-space:nowrap;">
    🎵 BGM
  </button>
</div>

<div id="app">
  <!-- PAGE 1: HOME -->
  <section id="page-home" class="page active">
    <div class="crest-wrap">
      <svg class="crest-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="cg" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#e8c97a"/><stop offset="100%" stop-color="#7a6130"/>
          </radialGradient>
        </defs>
        <path d="M100 10 L175 40 L175 130 Q175 175 100 195 Q25 175 25 130 L25 40 Z" fill="rgba(13,10,26,0.8)" stroke="url(#cg)" stroke-width="2.5"/>
        <line x1="100" y1="10" x2="100" y2="195" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
        <line x1="25" y1="102" x2="175" y2="102" stroke="#c9a84c" stroke-width="1.5" opacity="0.5"/>
        <text x="62" y="88" text-anchor="middle" font-size="32" fill="#ae0001">🦁</text>
        <text x="137" y="88" text-anchor="middle" font-size="28" fill="#1a6e3a">🐍</text>
        <text x="62" y="160" text-anchor="middle" font-size="28" fill="#3a5a9e">🦅</text>
        <text x="137" y="160" text-anchor="middle" font-size="28" fill="#d4a017">🦡</text>
        <text x="100" y="30" text-anchor="middle" font-family="serif" font-size="14" fill="#c9a84c" font-weight="bold">⚡</text>
      </svg>
    </div>
    <h1 class="home-title">霍格沃茨<br>分院测试</h1>
    <p class="home-subtitle">· Hogwarts Sorting & Personality ·</p>
    <div class="gold-divider"></div>
    <p class="home-desc">四十五道题，四大学院，五种人格。<br>让分院帽读取你内心深处的魔法，<br>在二十种命运之中，寻见属于你的那一个。</p>
    <button class="btn-start" onclick="startQuiz()">✦ 开始测试 ✦</button>
    <p class="disclaimer">⚠️ 本测试结果仅供娱乐参考，不构成任何专业心理诊断或医疗建议。大五人格维度解读基于科普简化，如需专业评估请咨询持证心理咨询师。测试结果不代表个人能力高低，请理性看待。</p>
  </section>

  <!-- PAGE 2: QUIZ -->
  <section id="page-quiz" class="page">
    <div class="progress-wrap">
      <div class="progress-info">
        <span class="progress-scene" id="scene-label">场景一 · 对角巷</span>
        <span class="progress-count" id="progress-count">1 / 45</span>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <div class="question-card">
      <div class="scene-label" id="q-scene"></div>
      <div class="question-num" id="q-num"></div>
      <p class="question-text" id="q-text"></p>
      <ul class="options-list" id="options-list"></ul>
    </div>
    <div class="quiz-nav">
      <button class="btn-nav" id="btn-prev" onclick="prevQuestion()">← 返回</button>
      <button class="btn-nav primary" id="btn-next" onclick="nextQuestion()">继续 →</button>
    </div>
  </section>

  <!-- PAGE 3: LOADING -->
  <section id="page-loading" class="page">
    <div class="sorting-hat-wrap">🎩</div>
    <p class="loading-text">分院帽正在感知你的灵魂<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></p>
  </section>

  <!-- PAGE 4: RESULT -->
  <section id="page-result" class="page">
    <div class="result-banner" id="result-banner">
      <span class="house-badge" id="result-badge"></span>
      <div class="result-house-name" id="result-house-name"></div>
      <div class="result-house-motto" id="result-house-motto"></div>
      <div class="result-personality-tag" id="result-personality-tag"></div>
    </div>
    <div class="result-desc-card" id="result-desc-card">
      <h3>🔮 你的魔法人格解析</h3>
      <div id="result-desc-text"></div>
    </div>
<div class="result-desc-card" id="result-sub-card" style="display:none;">
  <h3>🌙 你的第二倾向</h3>
  <div id="result-sub-text"></div>
</div>
    <div class="ocean-section" id="ocean-section">
      <h3>📊 大五人格维度</h3>
      <div id="ocean-bars"></div>
    </div>
    <button class="btn-restart" onclick="restartQuiz()">✦ 重新测试 ✦</button>
  </section>
</div>

<script>
/* ============================================================
   SCENES
   范围已更新至45题：
   场景一 Q1-10, 场景二 Q11-20, 场景三 Q21-30,
   场景四 Q31-40, 场景五(分院帽之问) Q41-45
============================================================ */
const SCENES = [
  { id:1, label:'场景一 · 对角巷',     range:[0,9]  },
  { id:2, label:'场景二 · 霍格沃茨特快', range:[10,19] },
  { id:3, label:'场景三 · 校内课程',   range:[20,29] },
  { id:4, label:'场景四 · 黑暗冒险',   range:[30,39] },
  { id:5, label:'场景五 · 分院帽之问', range:[40,44] },
];

/* ============================================================
   QUESTIONS
   每题结构: { scene, text, opts:[{text, house, trait, reverse?}] }
   house: G/S/R/H  trait: O/C/E/A/N  house_only: true = 纯学院题
   reverse: true = 反向计分题（选项得分取反，由computeScores处理）

   ── 修改说明 ──
   1. Q6、Q7、Q15、Q22、Q31 改为反向计分题
      原N类选项重新绑定更合理的学院，不再污染学院分
   2. 新增Q41-Q45共5道纯学院题（house_only:true），
      这5题只计学院分，不计入大五维度，且不参与封顶
   3. 大五-学院交叉题单院封顶值=12（原40题）
============================================================ */
const QUESTIONS = [
/* ── 场景一：对角巷 Q1-10 ── */
{
  scene:'场景一 · 对角巷',
  text:'你第一次踏入对角巷，眼前热闹非凡。你首先被什么吸引？',
  opts:[
    {text:'奥利凡德魔杖店——每根魔杖背后都有独特的历史', house:'R', trait:'O'},
    {text:'光轮2001扫帚展示柜——最快的扫帚，不容错过',   house:'G', trait:'E'},
    {text:'格林格兹银行的宏伟建筑，思考财富背后的权力逻辑', house:'S', trait:'C'},
    {text:'韦斯莱双胞胎的玩笑商店，爆炸糖的气味让你忍俊不禁', house:'H', trait:'A'},
  ]
},
{
  scene:'场景一 · 对角巷',
  text:'福利斯克的甜品店里，你会点什么？',
  opts:[
    {text:'黄油啤酒——经典，暖心，绝对没错',          house:'H', trait:'A'},
    {text:'蟾蜍巧克力——集齐Famous Witch&Wizard卡牌才是目的', house:'R', trait:'C'},
    {text:'嚼不烂太妃糖——测试它到底有多奇特',          house:'G', trait:'O'},
    {text:'什么也不点，暗暗观察每个进店顾客的举动',      house:'S', trait:'C'},
  ]
},
{
  scene:'场景一 · 对角巷',

let currentQ = 0;

/* ============================================================
   PAGE NAV
============================================================ */
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-'+id).classList.add('active');
}

/* ============================================================
   QUIZ
============================================================ */
function startQuiz() {
  if (loadProgress() && answers.some(a => a !== null)) {
    showPage('quiz');
    renderQuestion();
    return;
  }
  currentQ = 0;
  answers  = new Array(QUESTIONS.length).fill(null);
  scores   = {G:0,S:0,R:0,H:0,O:0,C:0,E:0,A:0,N:0};
  showPage('quiz');
  renderQuestion();
}

function renderQuestion() {
  const q   = QUESTIONS[currentQ];
  const num = currentQ + 1;
  const tot = QUESTIONS.length;
  const pct = Math.round((num-1)/tot*100);
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('progress-count').textContent = `${num} / ${tot}`;
  const sceneObj = SCENES.find(s => num-1 >= s.range[0] && num-1 <= s.range[1]);
  document.getElementById('scene-label').textContent = sceneObj ? sceneObj.label : '';
  document.getElementById('q-scene').textContent = q.scene;
  document.getElementById('q-num').textContent = `第 ${num} 题`;
  document.getElementById('q-text').textContent = q.text;
  const letters = ['A','B','C','D'];
  const ol = document.getElementById('options-list');
  ol.innerHTML = '';
  q.opts.forEach((opt,i) => {
    const li  = document.createElement('li');
    const btn = document.createElement('button');
    btn.className = 'option-btn' + (answers[currentQ]===i ? ' selected' : '');
    btn.innerHTML = `<span class="opt-letter">${letters[i]}</span>${opt.text}`;
    btn.onclick = () => selectOption(i);
    li.appendChild(btn);
    ol.appendChild(li);
  });
  document.getElementById('btn-prev').disabled = currentQ === 0;
  const isLast = currentQ === QUESTIONS.length-1;
  document.getElementById('btn-next').textContent = isLast ? '提交 ✦' : '继续 →';
}

function selectOption(idx) {
  answers[currentQ] = idx;
  document.querySelectorAll('.option-btn').forEach((b,i) => b.classList.toggle('selected', i===idx));
  saveProgress(); // 加这行
}

function nextQuestion() {
  if (answers[currentQ] === null) {
    document.querySelector('.question-card').style.border = '1px solid #c9a84c';
    setTimeout(() => document.querySelector('.question-card').style.border = '', 600);
    return;
  }
  const isLast = currentQ === QUESTIONS.length-1;
  if (!isLast) { currentQ++; renderQuestion(); }
  else { computeScores(); showLoading(); }
}

function prevQuestion() {
  if (currentQ > 0) { currentQ--; renderQuestion(); }
}

/* ============================================================
   SCORING
   规则：
   · 纯学院题(house_only):  只加 houseScores，不加 traitScores
   · 普通交叉题:            houseScores += 1，traitScores += 1
   · 大五-学院交叉题单院封顶 = 12（保护分布均衡）
   · 纯学院题分值不参与封顶
============================================================ */
function computeScores() {
  const CAP = 12; // 普通题单院封顶
  const TRAIT_CAP = 13;
  const houseRaw   = {G:0,S:0,R:0,H:0};
  const housePure  = {G:0,S:0,R:0,H:0}; // 纯学院题独立累计
  const traitScores= {O:0,C:0,E:0,A:0,N:0};

  QUESTIONS.forEach((q, qi) => {
    if (answers[qi] === null) return;
    const opt = q.opts[answers[qi]];
    if (q.house_only) {
      housePure[opt.house] = (housePure[opt.house]||0) + 1;
    } else {
      // 普通题：学院分受封顶
      if (houseRaw[opt.house] < CAP) {
        houseRaw[opt.house]++;
      }
      // 大五分
      if ((traitScores[opt.trait]||0) < TRAIT_CAP) {
        traitScores[opt.trait] = (traitScores[opt.trait]||0) + 1;
      }
    }
  });

  // 合并学院分：普通题封顶后 + 纯学院题不限
  scores = {
    G: houseRaw.G + housePure.G,
    S: houseRaw.S + housePure.S,
    R: houseRaw.R + housePure.R,
    H: houseRaw.H + housePure.H,
    ...traitScores,
  };
}

/* ============================================================
   LOADING
============================================================ */
function showLoading() {
  showPage('loading');
  setTimeout(() => { buildResult(); showPage('result'); animateResult(); }, 2800);
}

/* ============================================================
   RESULT
============================================================ */
function buildResult() {
  // 学院：最高分，同分破局 R>G>H>S
  let topHouse = ['G','S','R','H'].reduce((a,b) => 
  scores[a] > scores[b] ? a : 
  scores[a] < scores[b] ? b : 
  Math.random() < 0.5 ? a : b
);

  // 大五：最高维度，同分破局 O>C>E>A>N
  let topTrait = ['O','C','E','A','N'].reduce((a,b) =>
  scores[a] > scores[b] ? a :
  scores[a] < scores[b] ? b :
  Math.random() < 0.5 ? a : b
);

  const house  = HOUSES[topHouse];
  const resKey = `${topHouse}_${topTrait}`;
  const result = RESULTS[resKey] || RESULTS[`${topHouse}_O`];

  const banner = document.getElementById('result-banner');
  banner.style.background  = house.bg;
  banner.style.boxShadow   = `0 0 60px ${house.shadow}, inset 0 0 40px rgba(0,0,0,0.5)`;
  banner.style.borderColor = house.color1;
  document.getElementById('result-badge').textContent         = house.badge;
  document.getElementById('result-house-name').textContent    = house.name;
  document.getElementById('result-house-name').style.color    = house.textColor;
  document.getElementById('result-house-motto').textContent   = `"${house.motto}"`;
  document.getElementById('result-house-motto').style.color   = house.textColor;
  document.getElementById('result-personality-tag').textContent    = result.tag;
  document.getElementById('result-personality-tag').style.borderColor = house.textColor;
  document.getElementById('result-personality-tag').style.color       = house.textColor;
  document.getElementById('result-desc-text').textContent     = result.desc;
// 副人格
const houseOrder2 = ['G','S','R','H'].filter(h => h !== topHouse);
const subHouse = houseOrder2.reduce((a,b) =>
  scores[a] > scores[b] ? a :
  scores[a] < scores[b] ? b :
  Math.random() < 0.5 ? a : b
);
const traitOrder2 = ['O','C','E','A','N'].filter(t => t !== topTrait);
const subTrait = traitOrder2.reduce((a,b) =>
  scores[a] > scores[b] ? a :
  scores[a] < scores[b] ? b :
  Math.random() < 0.5 ? a : b
);
const subKey = `${subHouse}_${subTrait}`;
const subResult = RESULTS[subKey] || RESULTS[`${subHouse}_O`];
const subDesc = SUB_RESULTS[subKey] || SUB_RESULTS[`${subHouse}_O`];
const subCard = document.getElementById('result-sub-card');
document.getElementById('result-sub-text').innerHTML =
  `<strong style="color:var(--gold)">${HOUSES[subHouse].badge} ${HOUSES[subHouse].name} · ${subResult.tag}</strong><br><br>${subDesc}`;
subCard.style.display = 'block';

  const maxT = Math.max(...['O','C','E','A','N'].map(t=>scores[t]||0), 1);
  document.getElementById('ocean-bars').innerHTML = ['O','C','E','A','N'].map(t => {
    const pct = Math.round((scores[t]||0)/maxT*100);
    return `<div class="ocean-bar-item" data-pct="${pct}">
      <div class="ocean-bar-label">
        <span class="ocean-bar-name">${TRAITS[t].name}</span>
        <span class="ocean-bar-val">${pct}%</span>
      </div>
      <div class="ocean-bar-track"><div class="ocean-bar-fill" style="width:0%"></div></div>
    </div>`;
  }).join('');
}

function animateResult() {
  document.querySelectorAll(
    '.house-badge,.result-house-name,.result-house-motto,.result-personality-tag,.result-desc-card,#result-sub-card,.ocean-section,.btn-restart'
  ).forEach(el => {
    el.style.opacity = '';
    el.style.animation = 'none';
    el.offsetHeight;
    el.style.animation = '';
  });
  setTimeout(() => {
    document.querySelectorAll('.ocean-bar-item').forEach((item,i) => {
      setTimeout(() => {
        item.querySelector('.ocean-bar-fill').style.width = item.dataset.pct+'%';
      }, i*200);
    });
  }, 1500);
}

function restartQuiz() {
  clearProgress();
  currentQ = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  scores = {G:0,S:0,R:0,H:0,O:0,C:0,E:0,A:0,N:0};
  showPage('home');
}

/* ============================================================
   BGM
============================================================ */
let bgmPlaying = false;
function toggleBGM() {
  const bgm = document.getElementById('bgm');
  const btn = document.getElementById('bgmBtn');
  if (bgmPlaying) {
    bgm.pause();
    btn.textContent = '🎵 BGM';
    btn.style.opacity = '0.6';
    bgmPlaying = false;
  } else {
    bgm.play().then(() => {
      btn.textContent = '🔊 BGM ▶';
      btn.style.opacity = '1';
      bgmPlaying = true;
    }).catch(() => {
      btn.textContent = '❌ 链接失效';
    });
  }
}
document.querySelector('.btn-start').addEventListener('click', () => {
  if (!bgmPlaying) toggleBGM();
});
// 答题缓存：每次选择后自动保存，刷新后恢复
function saveProgress() {
  localStorage.setItem('hg_answers', JSON.stringify(answers));
  localStorage.setItem('hg_currentQ', currentQ);
}
function loadProgress() {
  const saved = localStorage.getItem('hg_answers');
  const savedQ = localStorage.getItem('hg_currentQ');
  if (saved) {
    answers = JSON.parse(saved);
    currentQ = parseInt(savedQ) || 0;
    return true;
  }
  return false;
}
function clearProgress() {
  localStorage.removeItem('hg_answers');
  localStorage.removeItem('hg_currentQ');
}
</script>
